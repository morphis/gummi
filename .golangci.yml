version: "2"

linters:
  enable:
    - bodyclose
    - gosec
    - misspell
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - whitespace
  settings:
    errcheck:
      # Close/Remove in defer or error paths: failure is either
      # unactionable or already surfaced by the operation that matters.
      # fmt.Fprint* here is CLI report rendering to stdout, where a
      # write failure is equally unactionable.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*os.File).Close
        - (io.ReadCloser).Close
        - os.Remove
        - (*github.com/morphis/gummi/internal/state.Store).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      # Tests exercise throwaway repos and fixed local paths, and Close
      # on cleanup in a test is not worth checking.
      - path: _test\.go
        linters:
          - gosec
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
