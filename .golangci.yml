version: "2"

linters:
  enable:
    - bodyclose
    - gosec
    - misspell
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - whitespace
  settings:
    errcheck:
      # Close/Remove in defer or error paths: failure is either
      # unactionable or already surfaced by the operation that matters.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*os.File).Close
        - os.Remove
        - (*github.com/morphia/gummi/internal/state.Store).Close
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      # Tests exercise throwaway repos and fixed local paths.
      - path: _test\.go
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
