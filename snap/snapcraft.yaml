name: gummi-agent
title: Gummi
summary: Terminal-first CLI/TUI for code review and issue workflows
description: |
  Gummi is a terminal-first CLI/TUI for code review and issue workflows.
  This snap packages the gummi single-binary built from ./cmd/gummi.
base: core24
confinement: classic
license: MIT
adopt-info: metadata
apps:
  gummi:
    command: bin/gummi

parts:
  metadata:
    plugin: nil
    source: .
    override-build: |
      : "${RELEASE_VERSION:=0.0.0}"
      if [ "$RELEASE_VERSION" = "0.0.0" ]; then
        echo "Warning: RELEASE_VERSION is unset; defaulting to $RELEASE_VERSION"
      fi
      craftctl set version="$RELEASE_VERSION"

  gummi:
    plugin: dump
    source: .
    build-snaps:
      - go/1.26/stable
    override-build: |
      go build -ldflags "-X main.Version=${RELEASE_VERSION:-0.0.0}" -o "$CRAFT_PART_INSTALL"/bin/gummi ./cmd/gummi
    prime:
      - bin/gummi
